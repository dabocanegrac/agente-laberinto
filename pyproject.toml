[project]
name = "agente-laberinto"
version = "0.1.0"
description = "Planificador y simulador del agente que resuelve un laberinto"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ziglang"]   # ziglang: compilador de C++ para test_planner_cpp.py si no hay g++/clang++
imprimir = ["reportlab"]
cable = ["pyserial"]

[tool.pytest.ini_options]
testpaths = ["pc/tests"]
pythonpath = ["."]
